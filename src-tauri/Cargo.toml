[package]
name = "lich-am"
version = "1.0.0"
description = "Lịch âm Việt Nam trên desktop"
authors = ["Lich am"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
